spring.application.name=MultipleDb
spring.profile.active=dev
#MySQL database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/multiple_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#PostgreSQL configuration

spring.datasource.dbcp2.url=jdbc:postgresql://localhost:5000/multiple_db
spring.datasource.dbcp2.username=postgres
spring.datasource.dbcp2.password=root
spring.datasource.dbcp2.driver-class-name=org.postgresql.Driver
#spring.second-datasource.url=
#spring.second-datasource.username=
#spring.second-datasource.password=
#spring.second-datasource.driver-class-name=


spring.profiles.active=${ENV:dev}